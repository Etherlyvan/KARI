name: Check KARI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kari_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: kari_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kari_test -d kari_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://kari_test:ci-test-only@127.0.0.1:5432/kari_test
      KARI_TEST_DATABASE_URL: postgresql://kari_test:ci-test-only@127.0.0.1:5432/kari_test
      AI_ENABLED: "false"
      TELEGRAM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:validate
      - run: npm run db:migrate
      - run: npm run check
      - run: npm test
      - run: npm run build
